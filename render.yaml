services:
  # ── 1. FastAPI Backend Web Service ──
  - type: web
    name: nexus-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGODB_URI
        sync: false # Entered securely in Render Dashboard (never committed)

  # ── 2. Next.js Frontend Web Service ──
  - type: web
    name: nexus-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -p $PORT
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.14.0
      - key: NEXT_PUBLIC_API_URL
        sync: false # Set to https://<your-backend-service>.onrender.com in Render Dashboard
